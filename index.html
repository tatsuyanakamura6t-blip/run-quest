<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Run Quest</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <!-- 上部：計測値 -->
  <header class="stats">
    <div class="stat-main">
      <span id="distance">0.00</span><small>km</small>
    </div>
    <div class="stat-row">
      <div class="stat"><label>時間</label><span id="time">00:00</span></div>
      <div class="stat"><label>平均ペース</label><span id="avgPace">--'--"</span></div>
      <div class="stat"><label>現在ペース</label><span id="curPace">--'--"</span></div>
    </div>
  </header>

  <div id="status">位置情報を待っています…</div>

  <button id="recenterBtn" class="icon-btn" title="現在地に戻る">◎</button>

  <!-- 下部：操作 -->
  <footer class="controls">
    <label class="sim">
      <input type="checkbox" id="simToggle">
      シミュレーション
      <select id="simSpeed">
        <option value="1">×1</option>
        <option value="10" selected>×10</option>
        <option value="30">×30</option>
      </select>
    </label>
    <div class="buttons">
      <button id="startBtn" class="primary">スタート</button>
      <button id="pauseBtn" hidden>一時停止</button>
      <button id="finishBtn" class="danger" hidden>終了</button>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
